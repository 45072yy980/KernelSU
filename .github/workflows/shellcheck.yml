name: ShellCheck

# 触发范围只列项目自己的脚本：tools/ 下是本地开发工具（dsha-diksu-git 插件及其部署脚本），
# 不是项目内容，改它们不该惊动项目 CI；将来在别处新增脚本目录记得补进来。
on:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/shellcheck.yml'
      - 'kernel/**/*.sh'
      - 'userspace/**/*.sh'
      - 'manager/**/*.sh'
      - 'scripts/**/*.sh'
      - '*.sh'
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '.github/workflows/shellcheck.yml'
      - 'kernel/**/*.sh'
      - 'userspace/**/*.sh'
      - 'manager/**/*.sh'
      - 'scripts/**/*.sh'
      - '*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_names: gradlew
          # hma-oss-config.sh 是推到设备上执行的资产脚本，不是仓库构建脚本；
          # 它带着上游的几处风格问题（SC2012/SC2059/SC2126），扫描它只会一直红。
          # 最后一项是本地开发工具的部署脚本：它有自己的 node 自测，不随项目检查。
          # 注意 ignore_paths 只对具体文件生效，写目录（./tools）排除不掉其下的文件。
          ignore_paths: ./userspace/ksud/src/installer.sh ./.github/scripts/setup-rust-build.sh ./manager/app/src/main/assets/hma-oss-config.sh ./tools/dsha-diksu-git/scripts/deploy.sh
