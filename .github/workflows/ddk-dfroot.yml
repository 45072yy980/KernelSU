name: Build DirtyFrag Kernel Module

# DirtyFrag 的内核模块（dfroot.ko）必须和本项目一起编：它里面 bootstrap 的
# 路径是一块由 exp.c 运行时改写的槽位，上游预编译的 ko 写死的是 df.root。
# 矩阵和 kernelsu.ko 完全一致，用的是同一批 DDK 镜像。

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string

jobs:
  build-dfroot-ko:
    name: Build dfroot.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Build dfroot.ko
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU

        cd manager/app/src/main/cpp/dirtyfrag/lkm

        echo "=== Building dfroot.ko for KMI: ${{ inputs.kmi }} ==="
        make -j$(nproc)

        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p "$OUT_DIR"
        OUTPUT="$OUT_DIR/dfroot-${{ inputs.kmi }}.ko"
        cp dfroot.ko "$OUTPUT"

        # 这个 ko 是被页缓存逐页写进内核的，体积越小越稳：和上游一样把
        # 内核侧用不到的段全部剥掉。
        llvm-objcopy --strip-unneeded \
          -R .comment -R .note.gnu.property -R .note.Linux -R .note.GNU-stack \
          -R .BTF -R .BTF.base -R .llvm_addrsig \
          -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
          -R .hyp.patchable_function_entries -R .hyp.data "$OUTPUT"

        echo "=== Build completed ==="
        ls -la "$OUTPUT"

    - name: Upload dfroot.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: dfroot-ko-${{ inputs.kmi }}
        path: /github/workspace/out/aarch64/dfroot-${{ inputs.kmi }}.ko
